<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Burrec mos u zemëro</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root {
      color-scheme: only light;
      --bg: #f8f4eb;
      --panel: #ffffff;
      --text: #263f2a;
      --muted: #4f5f51;
      --border: #263f2a;
      --shadow: #1f3322;
      --accent: #71bd26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #fff9ee 0%, var(--bg) 100%);
      color: var(--text);
      padding: 16px;
    }
    .panel {
      max-width: 460px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 0 0 var(--shadow);
      padding: 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { line-height: 1.55; color: var(--muted); margin: 0 0 6px; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 0 0 var(--shadow);
      padding: 10px 18px;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 0 var(--shadow); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Page not found</h1>
    <p>This page doesn't exist. The game is one click away.</p>
    <p lang="sq">Kjo faqe nuk ekziston. Loja është një klikim larg.</p>
    <a class="btn" href="/">Play / Luaj</a>
  </main>
</body>
</html>
