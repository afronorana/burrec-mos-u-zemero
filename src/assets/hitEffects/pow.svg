<!--
  Capture-effect template ("POW!"). Conventions for every effect SVG:
  - viewBox="0 0 300 240", no width/height (the app's CSS sizes it).
  - Top-level layer groups with these exact classes, painted back-to-front:
      fx-burst  background star / cloud
      fx-text   the word
      fx-spark  optional accents (impact lines, small stars)
    The app animates the layers by class — follow the naming and any new
    SVG gets the pop/settle/fade choreography automatically.
  - Strokes use the game's toon outline color #1b1411.
  - When exporting from a design tool, convert text to outlines/paths so the
    word doesn't depend on fonts being installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <g class="fx-burst">
    <polygon
      points="155,10.1 170.2,73 205.4,36.2 191.4,88.2 268,70.4 216.4,109.9 266.2,128.4 211.3,131.4 275.4,174.6 194.4,158.3 206.7,209.8 163.9,173.5 152.3,226.1 136.3,168.9 86.8,201.8 102.2,157.1 34.6,183.4 90.6,137.2 26.5,120.3 84.5,107.2 35.7,63.4 108.1,84 86,41.3 132.1,75.9"
      fill="#ffd93b" stroke="#1b1411" stroke-width="7" stroke-linejoin="miter"/>
    <polygon
      points="153.4,45.9 163.7,88.7 187.7,63.6 178.2,99 230.2,86.9 195.2,113.8 229,126.4 191.7,128.4 235.3,157.8 180.2,146.7 188.6,181.7 159.4,157 151.6,192.8 140.7,153.9 107,176.3 117.5,145.9 71.5,163.7 109.6,132.4 66,120.8 105.4,111.9 72.3,82.2 121.5,96.1 106.5,67.1 137.9,90.7"
      fill="#ff9f1a"/>
  </g>
  <g class="fx-text">
    <text x="150" y="147" text-anchor="middle" transform="rotate(-7 150 122)"
      font-family="'Arial Black', 'Archivo Black', sans-serif" font-size="72"
      font-weight="900" letter-spacing="1"
      paint-order="stroke" stroke="#1b1411" stroke-width="10"
      stroke-linejoin="round" fill="#ffffff">POW!</text>
  </g>
  <g class="fx-spark">
    <line x1="207.7" y1="32.7" x2="214.3" y2="22.4" stroke="#1b1411" stroke-width="5" stroke-linecap="round"/>
    <line x1="280.4" y1="176.7" x2="295.4" y2="183.0" stroke="#1b1411" stroke-width="5" stroke-linecap="round"/>
    <line x1="84.3" y1="205.0" x2="76.7" y2="214.5" stroke="#1b1411" stroke-width="5" stroke-linecap="round"/>
    <line x1="31.1" y1="61.1" x2="17.4" y2="54.1" stroke="#1b1411" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
