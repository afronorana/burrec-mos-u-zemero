# Dev config, mounted into the nakama container by docker-compose.yml.
name: burrec-nakama
logger:
  level: "INFO"
session:
  # Nakama's default token expiry is 60s — the socket dies mid-game without this.
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 604800
socket:
  # Must match VITE_NAKAMA_KEY on the client.
  server_key: "burrec-dev-key"
runtime:
  js_entrypoint: "index.js"
  env:
    # Email delivery (Resend). Empty API key = emails are skipped and logged;
    # EMAIL_DEV_ECHO=1 additionally returns verify/reset links in RPC payloads
    # (dev only — never enable in prod, it bypasses the mailbox).
    - "RESEND_API_KEY="
    - "EMAIL_FROM=Burrec <noreply@example.com>"
    - "PUBLIC_URL=http://localhost:3000"
    - "EMAIL_DEV_ECHO=1"
    # Demo mode: lets clients force dice values via ROLL_REQUEST { demand }
    # (typing TEST in the client toggles it). Dev only — never enable in prod.
    - "DEMO_DICE=1"
    # Admins (#admin): comma-separated user ids of Members. The dev id is
    # the custom-auth user "burrec-e2e-admin" that nakama/tests/e2e_moderation.mjs
    # signs in as (stable while the dev postgres volume lives); add your own
    # dev user id (shown on the #admin screen when refused) to try the panel.
    - "ADMIN_USER_IDS=767c2a24-637b-49db-9ab8-3223fa1d8796"
# Sign in with Apple (web) — set to the Apple *Services ID* once the Apple
# Developer account exists; Google needs no server config (ID tokens are
# validated against Google's public certs).
# social:
#   apple:
#     bundle_id: "com.example.burrec.web"
