  <!-- Cookie consent defaults (Google Consent Mode v2): analytics stays off
       until the visitor accepts in the banner (src/utils/consent.js), and a
       stored choice applies before the tag loads. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function () {
      var consent = 'denied';
      try {
        if (window.localStorage.getItem('burrec.cookieConsent') === 'accepted') consent = 'granted';
      } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: consent,
      });
    })();
  </script>

  <!-- Google tag (gtag.js) -->

    gtag('config', 'G-57PQXLXMRV');
